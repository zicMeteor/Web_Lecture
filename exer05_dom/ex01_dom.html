<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>DOM 선택 실습</title>
    <script>
        window.onload = function() {
            let header1 = document.getElementById('title')
            header1.style.color = 'blue';

            let header2 = document.querySelector('h2')
            header2.innerHTML = 'JavaScript로 변경한 제목';

            let item1 = document.getElementsByClassName('item')
            for (let i=0; i <item1.length; i++){

                let item = item1[i];
                item.style.color = 'red';
            }

            let messages = document.getElementsByName('message');
            for (let i = 0; i < messages.length; i++) {
                let message = messages[i]
                message.style.backgroundColor = 'yellow';
            }

            let anys = document.querySelectorAll('p');
            for (let i = 0; i < anys.length; i++) {
                let any = anys[i]
                any.style.fontWeight = 'bold';
            }


        };
    </script>
</head>
<body>
    <h1 id="title">DOM 선택 실습</h1>
    <h2>기존 제목</h2>

    <p class="item">첫 번째 항목</p>
    <p class="item">두 번째 항목</p>
    <p class="item">세 번째 항목</p>

    <p name="message">안녕하세요!</p>
    <p name="message">JavaScript 실습입니다.</p>
</body>
</html>
